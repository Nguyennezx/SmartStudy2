services:
  - type: web
    name: smartstudy-timetable-ai
    runtime: python
    plan: free
    branch: hai
    rootDir: tools/ai_timetable
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: gunicorn cloud_app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_IMPORT_TOKEN
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_IMPORT_HOURLY_LIMIT
        value: "20"
